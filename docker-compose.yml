version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: votesecure_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: voting_system
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - votesecure_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: votesecure_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/voting_system
      JWT_SECRET: your_super_secret_jwt_key_change_in_production_2024
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - votesecure_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: votesecure_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - votesecure_net

volumes:
  mongo_data:

networks:
  votesecure_net:
    driver: bridge
